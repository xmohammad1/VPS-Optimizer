# Managed by PasarGuard optimizer v1.0.0 (profile: panel)
# Host: 8 cores / 30.6GB RAM. Regenerate with scripts/optimizer.sh.
# Remove this file and run 'sysctl --system' to revert.

## ---- file descriptors & inotify ----
fs.file-max = 2097152
fs.nr_open = 2097152
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
fs.aio-max-nr = 1048576

## ---- core networking ----
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 262144
net.core.default_qdisc = fq
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

## ---- TCP: buffers and memory pressure ----
net.ipv4.tcp_rmem = 4096 262144 33554432
net.ipv4.tcp_wmem = 4096 262144 33554432
net.ipv4.tcp_mem = 481256 641674 962512
net.ipv4.udp_mem = 320837 481256 721884
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.tcp_moderate_rcvbuf = 1

## ---- TCP: congestion control and throughput ----
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_fack = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_fastopen = 3

## ---- TCP: accept queue and SYN handling ----
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_abort_on_overflow = 0

## ---- TCP: connection teardown at scale ----
# Hundreds of thousands of subscription fetches churn sockets fast;
# short FIN/TIME_WAIT windows keep the local port range from filling.
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 1440000
net.ipv4.tcp_max_orphans = 262144
net.ipv4.tcp_orphan_retries = 2
net.ipv4.tcp_retries2 = 8
net.ipv4.ip_local_port_range = 10240 65535

## ---- TCP: keepalive (drops dead client sockets quickly) ----
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

## ---- ARP / neighbour tables ----
net.ipv4.neigh.default.gc_thresh1 = 4096
net.ipv4.neigh.default.gc_thresh2 = 8192
net.ipv4.neigh.default.gc_thresh3 = 16384
net.ipv6.neigh.default.gc_thresh1 = 4096
net.ipv6.neigh.default.gc_thresh2 = 8192
net.ipv6.neigh.default.gc_thresh3 = 16384

## ---- connection tracking ----
# 983040 entries ≈ 300 MB of kernel memory.
net.netfilter.nf_conntrack_max = 983040
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 20
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120
net.netfilter.nf_conntrack_generic_timeout = 120
net.netfilter.nf_conntrack_tcp_loose = 1

## ---- virtual memory ----
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 500
vm.min_free_kbytes = 250648
vm.max_map_count = 262144
vm.zone_reclaim_mode = 0
vm.overcommit_memory = 0

## ---- process / scheduler ----
kernel.pid_max = 4194304
kernel.threads-max = 1000000
kernel.sched_autogroup_enabled = 0
kernel.panic = 10
